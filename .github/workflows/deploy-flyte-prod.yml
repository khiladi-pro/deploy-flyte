name: Deploy Flyte Prod

on:
  workflow_dispatch:

env:
  TF_WORKSPACE: prod
  ENVIRONMENT: prod
  GCP_PROJECT_ID: kpro-prod
  GOOGLE_CREDENTIALS: ${{ secrets.PROD_GOOGLE_CREDENTIALS }}

jobs:
  terraform:
    name: Deploy Flyte Prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/gcp/prod/flyte-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Add cache for Terraform plugins and modules
      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.3.0"
          terraform_wrapper: false

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kpro-prod
          service_account_key: ${{ secrets.PROD_GOOGLE_CREDENTIALS }}
          export_default_credentials: true

      - name: Get GKE Credentials
        run: |
          echo '${{ secrets.PROD_GOOGLE_CREDENTIALS }}' > /tmp/gcloud-service-key.json
          gcloud auth activate-service-account --key-file="/tmp/gcloud-service-key.json"
          gcloud container clusters get-credentials flyte-gcp --region asia-south1
        

      - name: Terraform Init
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc
          terraform init -input=false

      - name: Terraform Format & Validate
        run: |
          terraform fmt
          git diff --exit-code || echo "Formatting changes made"
          terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
