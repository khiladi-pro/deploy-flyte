name: Deploy Flyte Production

on:
  push:
    branches:
      - main
    paths:
      - 'environments/gcp/prod/**'
  workflow_dispatch:

env:
  TF_WORKSPACE: production
  ENVIRONMENT: production
  GCP_PROJECT_ID: kpro-prod
  GOOGLE_CREDENTIALS: ${{ secrets.PROD_GOOGLE_CREDENTIALS }}

jobs:
  terraform:
    name: Deploy Flyte Production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: environments/gcp/prod/flyte-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.3.0"

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kpro-prod
          service_account_key: ${{ secrets.PROD_GOOGLE_CREDENTIALS }}
          export_default_credentials: true

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: your-github-username
          minimum-approvals: 1
          issue-title: "Production Deployment Approval Required"
          issue-body: "Please review and approve the Terraform plan for production deployment"
          exclude-workflow-initiator-as-approver: false

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
