name: Deploy Flyte Staging

on:
  workflow_dispatch:

env:
  TF_WORKSPACE: staging
  ENVIRONMENT: staging
  GCP_PROJECT_ID: kpro-staging
  GOOGLE_CREDENTIALS: ${{ secrets.STAGING_GOOGLE_CREDENTIALS }}

jobs:
  terraform:
    name: Deploy Flyte Staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/gcp/staging/flyte-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Terraform
        uses: actions/cache@v3
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.3.0"
          terraform_wrapper: false

      - name: Setup GCloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: kpro-staging
          service_account_key: ${{ secrets.STAGING_GOOGLE_CREDENTIALS }}
          export_default_credentials: true

      - name: Get GKE Credentials
        run: |
          echo '${{ secrets.STAGING_GOOGLE_CREDENTIALS }}' > /tmp/gcloud-service-key.json
          gcloud auth activate-service-account --key-file="/tmp/gcloud-service-key.json"
          gcloud container clusters get-credentials flyte-gcp --region asia-south1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          pip install bcrypt

      - name: Update Values File
        run: |
          BCRYPT_HASH=$(python3 -c "
          import bcrypt, base64
          print(base64.b64encode(bcrypt.hashpw('${{ secrets.STAGING_CLIENT_SECRET }}'.encode('utf-8'), bcrypt.gensalt(6))).decode('utf-8'))
          ")
          
          # Replace both the raw secret and its bcrypt hash
          sed -i "s|{{secrets.STAGING_SECRET}}|${{ secrets.STAGING_CLIENT_SECRET }}|g" values-gcp-core.yaml
          sed -i "s|{{var.STAGING_SECRET_BCRYPT_HASH}}|$BCRYPT_HASH|g" values-gcp-core.yaml

      - name: Terraform Init
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc
          terraform init -input=false

      - name: Terraform Format & Validate
        run: |
          terraform fmt
          git diff --exit-code || echo "Formatting changes made"
          terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
